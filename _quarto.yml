website:
  title: "Richard Schwank"
  description: "I am a third year PhD student at the chair of Mathematical Statistics at the Technical University of Munich (TUM), under the supervision of Prof. Mathias Drton."
  open-graph:
    title: "Richard Schwank"
    description: "I am a third year PhD student at the chair of Mathematical Statistics at the Technical University of Munich (TUM), under the supervision of Prof. Mathias Drton."
    image: images/Picture.jpg
  site-url: "https://rischwank.github.io/website/" #"https://lmareis.github.io"
  favicon: images/favicon.png
  search:
    location: navbar
    type: overlay
  back-to-top-navigation: false
  navbar:
    right:
      - text: "Research"
        href: pages/research.qmd
      - text: "Talks and Presentations"
        href: pages/presentations.qmd
      - text: "Teaching"
        href: pages/teaching.qmd
  page-footer:
    left: '[![](/images/by-nc-sa.png){fig-alt="CC BY-NC-SA 4.0" style="height:25px; vertical-align:top;"}](https://creativecommons.org/licenses/by-nc-sa/4.0/)'
    center:
      - text: "firstname.lastname (at) tum.de"
    right: 
      - text: "© 2026 Richard Schwank"

format:
  html:
    theme: [default, css/theme.scss]
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    # This is to include fontawesome and academic icons in the headers:
    include-in-header: "_includes/header.html"
